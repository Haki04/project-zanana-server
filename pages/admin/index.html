<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="w-full h-screen flex justify-center items-center">
      <div
        class="w-[90%] h-[90%] max-w-[1000px] bg-gray-200/75 rounded-2xl flex overflow-hidden p-2"
      >
        <!-- kiri -->
        <div
          class="w-[20%] h-full flex flex-col justify-start items-center bg-white rounded-l overflow-hidden"
        >
          <div
            class="h-[20%] bg-red-200 w-full flex justify-center items-center"
          >
            <img
              src="/image/soto.jpg"
              class="w-[120px] border-4 rounded-2xl"
              alt=""
            />
          </div>
          <div class="h-[60%] overflow-y-scroll bg-blue-200 w-full p-1">
            <ul
              class="w-full flex flex-col justify-center gap-7 [&>*]:p-1 [&>*]:border [&>*]:border-transparent [&>*]:hover:border-black [&>*]:hover:bg-yellow-50 [&>*]:rounded [&>*]:text-left [&>*]:cursor-pointer transition"
              id="ul-dashboard"
            >
              <li onclick="section('dashboard', this)" id="dash-board">
                Dashboard
              </li>
              <li onclick="section('information', this)">Information</li>
              <li onclick="section('inventory', this)">Inventory</li>
              <li onclick="section('stocks', this)">Stocks</li>
              <li onclick="section('staff', this)">Staff</li>
              <li onclick="section('pesanan', this)">Pesanan</li>
              <li onclick="section('kerusakan', this)">Kerusakan</li>
            </ul>
          </div>
          <div
            class="h-[20%] bg-green-200 w-full flex justify-center flex-col items-center"
          >
            <img
              src="https://s3.getstickerpack.com/storage/uploads/sticker-pack/si-pentol/sticker_2.png?689d1b78c9e23ca51a0102665fe8bce8&d=200x200"
              alt=""
              class="w-[50px] h-[50px]"
            />
            <span class="font-bold text-[10px]">KIKI</span>
            <span
              class="font-bold text-[14px] p-1 bg-gray-50 rounded cursor-pointer"
              onclick="confirm('ingin keluar ?') ? logOutUser() : ''"
              >Log Out</span
            >
          </div>
        </div>

        <!-- kanan -->
        <div
          class="w-[80%] h-full bg-gray-200 rounded-r-[10px] flex flex-wrap gap-1 content-start p-1 overflow-y-scroll relative"
          id="content-right"
        ></div>
      </div>
    </div>
    <script>
      window.onload = () => section("staff", "");
    </script>
    <script type="module" src="/src/view/dashboard.js"></script>
  </body>
</html>
