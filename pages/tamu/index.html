<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guest</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div
      class="w-full h-screen bg-white flex justify-center items-center overflow-hidden"
      id="guest"
    >
      <div
        class="w-[300px] bg-white/60 rounded shadow-sm border flex flex-col gap-2 justify-center items-center max-h-[300px] p-2 overflow-hidden -mt-[20%] md:-mt-0"
        id="content-tamu"
      >
        <img src="" class="w-[100px]" alt="" srcset="" id="img-tamu-form" />
        <input
          type="text"
          name=""
          id="order-code-tamu"
          class="w-[90%] bg-white p-2 border border-black/50 mb-2 uppercase text-center"
          placeholder="paste your code"
          onfocus="changeImage(0, this)"
          oninput="changeImage(1, this)"
        />
        <button
          class="bg-green-200 rounded hover:scale-105 transition p-2 w-[40%] mb-4 cursor-pointer"
          onclick="getOrdersTamu()"
        >
          view
        </button>
      </div>
    </div>
    <script>
      function changeImage(param, input_el) {
        if (input_el.value.toLowerCase() == "nothing") input_el.value = "";
        const src_url = [
          "https://media.tenor.com/F5-hhiVwsZMAAAAi/smile-evil-smile.gif",
          "https://media.tenor.com/OU7qmzXIFBcAAAAi/bubu-dudu.gif",
        ];
        document.getElementById("img-tamu-form").src = src_url[param];
      }
    </script>
    <script type="module" src="/src/view/tamu.js"></script>
  </body>
</html>
