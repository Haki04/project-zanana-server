<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Purchases</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="w-full h-screen flex justify-center items-center">
      <div
        class="w-full max-w-[1000px] h-full flex justify-center items-center rounded overflow-hidden"
      >
        <div class="w-[80%] h-[80%] relative" id="parent-content-purchase">
          <div class="w-full p-1 bg-amber-200 rounded-t">
            <div
              class="flex w-full gap-1 items-center"
              id="search-bar-purchases"
            >
              <h1 class="flex-2 pl-2">Purcahses List</h1>
              <select
                name=""
                id="select-purchase"
                class="flex-1 bg-white p-1"
              ></select>
              <input
                type="text"
                name=""
                id=""
                class="w-[100px] p-1 bg-white"
                placeholder="default < 2"
              />
              <button
                class="flex-1 bg-gray-200 rounded cursor-pointer p-1"
                onclick="fillterPurcahsesList(this)"
              >
                Show
              </button>

              <button
                class="flex-1 bg-green-200 rounded cursor-pointer p-1"
                onclick="formInputItem()"
              >
                Add
              </button>
            </div>
            <div class="w-full">
              <ul
                class="flex justify-around items-center [&>*]:flex-1 [&>*]:text-center"
              >
                <li>Section</li>
                <li>Name item</li>
                <li>Total store</li>
                <li>Type</li>
                <li>Brand</li>
                <li>Perlu</li>
              </ul>
            </div>
          </div>
          <div
            class="w-full h-full bg-gray-200 flex flex-col items-center gap-2 p-1 rounded-b"
            id="content-purchases"
          ></div>
        </div>
      </div>
    </div>
    <script>
      window.onload = () => showPurchasesItem("content-purchases");
    </script>
    <script type="module" src="/src/view/purchases.js"></script>
  </body>
</html>
